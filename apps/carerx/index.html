<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F5E57" />
    <meta name="description" content="CareRx: refill your prescriptions in two taps." />
    <meta name="app-version" content="__APP_VERSION__" />
    <title>CareRx</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <script src="/shakefix-sdk.js" data-endpoint="%VITE_INTAKE_URL%/v1/reports" data-app="carerx" data-call-me="true" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a href="/" class="brand" data-link data-testid="home-link">Care<span>Rx</span></a>
        <nav class="topnav">
          <a href="/orders" data-link data-testid="orders-link">Orders</a>
          <a href="/settings" data-link data-testid="settings-link">Settings</a>
        </nav>
      </header>
      <div id="error-slot"></div>
      <main id="app" aria-live="polite"></main>
      <footer class="footer" data-shakefix-mask>CareRx demo app · <span data-testid="app-version" id="app-version"></span></footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
