<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="SplitPal: split bills with friends." />
    <meta name="app-version" content="__APP_VERSION__" />
    <title>SplitPal</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script src="/shakefix-sdk.js" data-endpoint="%VITE_INTAKE_URL%/v1/reports" data-app="splitpal" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a href="/" class="brand" data-link>Split<span>Pal</span></a>
        <a href="/settings" class="topbar-link" data-link data-testid="settings-link" aria-label="Settings">Settings</a>
      </header>
      <div id="error-slot"></div>
      <main id="app" aria-live="polite"></main>
      <footer class="footer">
        SplitPal <span data-testid="app-version" id="app-version"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
