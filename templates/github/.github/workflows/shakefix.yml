# ShakeFix on GitHub Actions: a port template of .gitlab-ci.yml (docs/PROVIDERS.md).
# Copy to .github/workflows/shakefix.yml in a GitHub repository. It is kept under templates/ so the
# GitLab project (the default, Duo-powered setup) is not confused by a second CI system.
#
# Stages, mirroring the GitLab pipeline:
#   agent          issues opened (label "shakefix") or "@shakefix" comment -> local agent runner (4 ER roles)
#   test           unit tests + regression specs (fail -> pass proof)
#   second_opinion PR preview on Cloud Run (tag pr-<n>, no traffic) -> proof run/label/report -> gate labels
#   merge          squash-merge ShakeFix PRs labelled shakefix::ready (policy re-checked by `proof gate`)
#   deploy         main: build -> Cloud Run (main-test + main tags) -> smoke -> notify intake | rollback
#
# Secrets / variables (Settings -> Secrets and variables -> Actions):
#   secrets.SHAKEFIX_GH_TOKEN    fine-grained PAT or GitHub App token (contents, issues, pull_requests: write).
#                                Needed because PRs and pushes made with the default GITHUB_TOKEN do NOT trigger
#                                other workflows (the GitHub twin of "GitLab triggers ignore bot users").
#   secrets.MODEL_API_KEY        Anthropic / Nebius / Vultr / OpenRouter key for the agent and the labeler
#   vars.MODEL_PROVIDER          anthropic | openai-compatible | none        (default anthropic)
#   vars.MODEL_NAME, vars.MODEL_BASE_URL                                     (openai-compatible)
#   vars.GCP_PROJECT_ID, vars.GCP_REGION, vars.GCP_WIF_PROVIDER, vars.GCP_SA_EMAIL   (Workload Identity Federation)
#   vars.INTAKE_URL, secrets.INTAKE_HOOK_SECRET                              (reporter "Fixed" push)
#   vars.SHAKEFIX_MAX_TOOL_CALLS                                             (optional cap per agent role)
# The WIF pool must trust token.actions.githubusercontent.com for this repository (see docs/PROVIDERS.md).

name: shakefix

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      issue:
        description: "Run the local agent runner on this issue number"
        required: false

permissions:
  contents: read

concurrency:
  group: shakefix-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  SCM_PROVIDER: github
  GITHUB_REPO: ${{ github.repository }}
  AGENT_RUNNER: local
  MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER || 'anthropic' }}
  MODEL_NAME: ${{ vars.MODEL_NAME }}
  MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
  SPLITPAL_SERVICE: splitpal
  AR_REPO: shakefix
  NODE_VERSION: "22"
  PNPM_VERSION: "9.12.0"

jobs:
  # ------------------------------------------------------------------------------------------------
  agent:
    name: ER team (local runner)
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'shakefix')
        && (github.event.action == 'opened' || github.event.label.name == 'shakefix'))
      || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
        && contains(github.event.comment.body, '@shakefix')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'workflow_dispatch' && inputs.issue != '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.SHAKEFIX_GH_TOKEN || secrets.GITHUB_TOKEN }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      SHAKEFIX_MAX_TOOL_CALLS: ${{ vars.SHAKEFIX_MAX_TOOL_CALLS }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter splitpal build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run the ER team (triage -> surgeon -> attending -> discharge)
        run: node packages/core/bin/shakefix-agent.js --issue "${{ github.event.issue.number || inputs.issue }}"

  # ------------------------------------------------------------------------------------------------
  test:
    name: unit + regression
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/sync-prompts.mjs --check
      - run: pnpm -r --if-present test
      - run: pnpm exec playwright install --with-deps chromium
      - name: Regression specs (fail on main -> pass here)
        env: { BASE_URL: "http://localhost:8080" }
        run: pnpm exec playwright test --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: "playwright-report/", retention-days: 14 }

  # ------------------------------------------------------------------------------------------------
  second_opinion:
    name: Second Opinion
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write          # Workload Identity Federation
      issues: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.SHAKEFIX_GH_TOKEN || secrets.GITHUB_TOKEN }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      PR: ${{ github.event.pull_request.number }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/shakefix/splitpal:${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build image (Cloud Build, same recipe as GitLab)
        run: |
          pnpm --filter shakefix-sdk build && cp packages/sdk/dist/shakefix-sdk.js apps/splitpal/public/ || true
          gcloud builds submit . --config infra/cloudbuild.yaml --quiet \
            --substitutions="_IMAGE=$IMAGE,_DOCKERFILE=apps/splitpal/Dockerfile,_CONTEXT=apps/splitpal,_VERSION=${GITHUB_SHA::7},_SA=${{ vars.GCP_SA_EMAIL }}"
      - name: Preview revision (tag pr-<n>, no traffic)
        run: |
          gcloud run deploy "$SPLITPAL_SERVICE" --image "$IMAGE" --region "$GCP_REGION" \
            --no-traffic --tag "pr-$PR" --update-env-vars "SHAKEFIX_TEST_HOOKS=1,APP_VERSION=${GITHUB_SHA::7}" --quiet
          echo "HEAD_URL=$(bash scripts/ci/traffic.sh url "pr-$PR")" >> "$GITHUB_ENV"
          echo "MAIN_URL=$(bash scripts/ci/traffic.sh url main-test)" >> "$GITHUB_ENV"
      - name: Replay base vs head, label, report
        run: |
          node packages/proof/bin/proof.js run --base "${BASE_URL:-$MAIN_URL}" --head "$HEAD_URL" \
            --flows "tests/e2e/*.flow.json" --replay-from-mr "$PR" --mr "$PR" --out proof/
          node packages/proof/bin/proof.js label --in proof/proof.json --issue-from-mr "$PR"
          node packages/proof/bin/proof.js report --in proof/proof.json --post-mr "$PR" --base-ref main
      - name: Gate (labels the PR like scripts/ci/proof-gate.sh)
        run: |
          git diff --numstat "origin/${{ github.base_ref }}...HEAD" > proof/diff-files.txt
          set +e
          node packages/proof/bin/proof.js gate --in proof/proof.json --policy .shakefix/policy.yml \
            --diff-files proof/diff-files.txt --mr "$PR"
          code=$?
          set -e
          scm=packages/core/bin/shakefix-scm.js
          case "$code" in
            0)  node $scm labels --mr "$PR" --add shakefix::ready --remove shakefix::proof,shakefix::unintended ;;
            10) node $scm labels --mr "$PR" --add shakefix::unintended --remove shakefix::ready,shakefix::proof
                node $scm note --mr "$PR" --body "Second Opinion found side effects; sending back to surgeon. _— Second Opinion, ShakeFix ER_"
                # Re-operate: a maintainer comment "@shakefix re-operate: see Second Opinion report on #$PR"
                # on the issue restarts the agent job (comments by GITHUB_TOKEN do not trigger workflows).
                for i in $(node $scm linked-issues --mr "$PR"); do
                  node $scm note --issue "$i" --body "@shakefix re-operate: see Second Opinion report on #$PR"
                done ;;
            11) node $scm labels --mr "$PR" --add needs-human --remove shakefix::ready,shakefix::proof
                node $scm note --mr "$PR" --body "Second Opinion stopped this PR for a human. _— Second Opinion, ShakeFix ER_" ;;
            *)  exit 1 ;;
          esac
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: second-opinion, path: "proof/", retention-days: 90 }

  # ------------------------------------------------------------------------------------------------
  merge:
    name: auto-merge (shakefix::ready only)
    needs: second_opinion
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'shakefix/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.SHAKEFIX_GH_TOKEN || secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - name: Merge when every gate agrees
        run: |
          scm=packages/core/bin/shakefix-scm.js
          labels="$(node $scm mr-labels --mr "$PR")"
          echo "labels: $labels"
          case ",$labels," in *",needs-human,"*) echo "needs-human: not merging"; exit 0 ;; esac
          case ",$labels," in *",shakefix::ready,"*) ;; *) echo "not ready: not merging"; exit 0 ;; esac
          node $scm merge --mr "$PR" --sha "${{ github.event.pull_request.head.sha }}"
          node $scm note --mr "$PR" --body "Cleared for discharge: Second Opinion found no unintended changes. _— Discharge, ShakeFix ER_"

  # ------------------------------------------------------------------------------------------------
  deploy:
    name: deploy -> smoke -> notify | rollback
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency: { group: production, cancel-in-progress: false }
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ secrets.SHAKEFIX_GH_TOKEN || secrets.GITHUB_TOKEN }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/shakefix/splitpal:${{ github.sha }}
      INTAKE_URL: ${{ vars.INTAKE_URL }}
      INTAKE_HOOK_SECRET: ${{ secrets.INTAKE_HOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build + deploy (main-test with hooks, then main with all traffic)
        run: |
          pnpm --filter shakefix-sdk build && cp packages/sdk/dist/shakefix-sdk.js apps/splitpal/public/ || true
          gcloud builds submit . --config infra/cloudbuild.yaml --quiet \
            --substitutions="_IMAGE=$IMAGE,_DOCKERFILE=apps/splitpal/Dockerfile,_CONTEXT=apps/splitpal,_VERSION=${GITHUB_SHA::7},_SA=${{ vars.GCP_SA_EMAIL }}"
          echo "PREV_REVISION=$(bash scripts/ci/traffic.sh current)" >> "$GITHUB_ENV"
          gcloud run deploy "$SPLITPAL_SERVICE" --image "$IMAGE" --region "$GCP_REGION" --no-traffic --tag main-test \
            --update-env-vars "SHAKEFIX_TEST_HOOKS=1,APP_VERSION=${GITHUB_SHA::7}" --quiet
          gcloud run deploy "$SPLITPAL_SERVICE" --image "$IMAGE" --region "$GCP_REGION" --tag main \
            --update-env-vars "SHAKEFIX_TEST_HOOKS=0,APP_VERSION=${GITHUB_SHA::7}" --quiet
          bash scripts/ci/traffic.sh latest
          echo "PROD_URL=$(gcloud run services describe "$SPLITPAL_SERVICE" --region "$GCP_REGION" --format='value(status.url)')" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Post-deploy smoke
        id: smoke
        run: |
          for i in 1 2 3 4 5 6; do curl -fsS "$PROD_URL/api/health" && break; sleep 5; [ "$i" = 6 ] && exit 1; done
          BASE_URL="$PROD_URL" pnpm exec playwright test --grep @smoke --reporter=line
      - name: Tell the intake + reporters "Fixed"
        if: success() && env.INTAKE_URL != ''
        run: |
          scm=packages/core/bin/shakefix-scm.js
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' || true)"
          [ -n "$pr" ] || { echo "no PR for $GITHUB_SHA"; exit 0; }
          for i in $(node $scm linked-issues --mr "$pr"); do
            rid="$(node $scm rid --issue "$i")"; [ -n "$rid" ] || continue
            body="$(jq -cn --arg rid "$rid" --arg sha "$GITHUB_SHA" --arg url "$PROD_URL" --argjson issueIid "$i" --argjson mrIid "$pr" --argjson ts "$(date +%s)" \
              '{rid:$rid, state:"deployed", issueIid:$issueIid, mrIid:$mrIid, sha:$sha, version:($sha[0:7]), prodUrl:$url, ts:$ts}')"
            sig="$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$INTAKE_HOOK_SECRET" -hex | awk '{print $NF}')"
            curl -fsS -X POST -H 'content-type: application/json' -H "x-shakefix-signature: $sig" \
              --data-binary "$body" "${INTAKE_URL%/}/v1/reports/$rid/fixed" || echo "intake notify failed for $rid"
            node $scm labels --issue "$i" --add shakefix::deployed
          done
      - name: Roll back on a failed smoke test
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          bash scripts/ci/traffic.sh to "$PREV_REVISION" 100
          scm=packages/core/bin/shakefix-scm.js
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' || true)"
          for i in $( [ -n "$pr" ] && node $scm linked-issues --mr "$pr" ); do
            node $scm labels --issue "$i" --add shakefix::rolled-back,needs-human --state reopen
            node $scm note --issue "$i" --body "Post-deploy smoke test failed; traffic returned to \`$PREV_REVISION\`. Readmitted. _— Attending, ShakeFix ER_"
          done
